# The agent sandbox's policy (ADR-0021): the image's non-root user, Landlock enforced or no
# sandbox, system paths and the scenario fixtures readable, and only the workspace writable.
# There are no network rules, so every connection is refused.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /proc, /dev/urandom, /srv/aegis/scenarios]
  read_write: [/srv/aegis/workspace, /dev/null]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "2000"
  run_as_group: "2000"
