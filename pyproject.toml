[project]
name = "aegis"
version = "0.0.0"
description = "Adaptive Runtime Assurance for Secure Autonomous Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Blocks PyPI uploads until a license is chosen.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
aegis = "aegis.apps.cli.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "local_ai: needs the local-ai Ollama service and AEGIS_OLLAMA_MODEL pulled",
    "openshell: needs the real OpenShell 0.1.6 gateway and AEGIS's workspace",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]
