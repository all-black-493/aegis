[project]
name = "aegis"
version = "0.0.0"
description = "Adaptive Runtime Assurance for Secure Autonomous Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Blocks PyPI uploads until a license is chosen.
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
