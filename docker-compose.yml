name: aegis

services:
  postgres:
    image: postgres:17.11-trixie@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_USER: ${AEGIS_POSTGRES_USER:?AEGIS_POSTGRES_USER must be set; run make setup}
      POSTGRES_PASSWORD: ${AEGIS_POSTGRES_PASSWORD:?AEGIS_POSTGRES_PASSWORD must be set; run make setup}
      POSTGRES_DB: ${AEGIS_POSTGRES_DB:?AEGIS_POSTGRES_DB must be set; run make setup}
    ports:
      - "127.0.0.1:${AEGIS_POSTGRES_PORT:?AEGIS_POSTGRES_PORT must be set; run make setup}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: the first-boot init server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    # Ollama 0.34.2, the version the adapter was verified against (ADR-0014).
    image: ollama/ollama@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    profiles: [local-ai]
    ports:
      - "127.0.0.1:${AEGIS_OLLAMA_PORT:-11436}:11434"
    volumes:
      - ollama-models:/root/.ollama
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  ollama-models:
